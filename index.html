<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo Site</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #3b82f6;
        --primary-dark: #1d4ed8;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dbe3ee;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eef4ff, #f8fafc);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 520px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 16px 30px rgba(15, 23, 42, 0.08);
        padding: 32px 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.5;
      }

      .demo-button {
        display: inline-block;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        padding: 14px 22px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.2s ease;
      }

      .demo-button:hover {
        background: var(--primary-dark);
      }

      .demo-button:active {
        transform: translateY(1px);
      }

      form {
        margin-top: 28px;
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 600;
      }

      input, textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
        color: var(--text);
        background: #fff;
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      .submit-btn {
        border: none;
        border-radius: 10px;
        background: #111827;
        color: #fff;
        padding: 12px 18px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      #status {
        min-height: 20px;
        font-size: 0.95rem;
        color: #15803d;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Demo website</h1>
      <p>A simple example page with a button and a form.</p>

      <button class="demo-button" id="demoButton" type="button">
        Click me
      </button>

      <form id="contactForm">
        <label>
          Name
          <input type="text" name="name" placeholder="Enter your name" required />
        </label>

        <label>
          Message
          <textarea name="message" placeholder="Write your message..." required></textarea>
        </label>

        <button class="submit-btn" type="submit">Submit</button>
        <div id="status" aria-live="polite"></div>
      </form>
    </main>

    <script>
      const demoButton = document.getElementById('demoButton');
      const contactForm = document.getElementById('contactForm');
      const status = document.getElementById('status');

      demoButton.addEventListener('click', () => {
        demoButton.textContent = 'Clicked!';
        demoButton.disabled = true;
        status.textContent = 'The button was clicked successfully.';
      });

      contactForm.addEventListener('submit', (event) => {
        event.preventDefault();
        const formData = new FormData(contactForm);
        const name = formData.get('name');
        const message = formData.get('message');

        status.textContent = `Thank you, ${name}! Your message: "${message}"`;
        contactForm.reset();
      });
    </script>
  </body>
</html>
